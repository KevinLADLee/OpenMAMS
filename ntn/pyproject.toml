[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmams-ntn"
version = "0.1.0"
description = "Satellite backhaul simulation and CARLA capture replay for OpenMAMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
topology = ["sgp4==2.24", "ephem==4.2"]
test = ["pytest>=8,<9"]

[project.scripts]
openmams-ntn = "satellite_backhaul.cli:main"

[tool.setuptools.packages.find]
include = ["satellite_backhaul*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
